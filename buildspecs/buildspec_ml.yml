version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install "sagemaker<3.0.0" boto3
  build:
    commands:
      - |
        echo "========================================================"
        echo "KIỂM TRA RELEASE TAG ĐỂ ĐIỀU PHỐI HUẤN LUYỆN SAGEMAKER..."
        echo "========================================================"
        
        # Xác định tên các Bucket theo chuẩn Enterprise (hỗ trợ fallback)
        ART_BUCKET=${ARTIFACTS_BUCKET:-$DATA_BUCKET}
        
        GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
        
        if [ -n "$GIT_TAG" ] || [ "$FORCE_TRAIN" = "true" ]; then
          echo "PHÁT HIỆN RELEASE TAG: '$GIT_TAG' (hoặc FORCE_TRAIN=true)"
          echo "KÍCH HOẠT SAGEMAKER AI TRAINING PIPELINE..."
          python aws_sagemaker/pipeline.py \
            --role-arn $SAGEMAKER_ROLE_ARN \
            --artifacts-bucket $ART_BUCKET \
            --execute
        else
          echo "Commit thông thường (không gắn Git Tag)."
          echo "CHỈ CẬP NHẬT ĐỊNH NGHĨA PIPELINE (UPSERT), KHÔNG CHẠY TRAINING LẠI!"
          echo "Để train model, hãy gắn tag: 'git tag v1.0 && git push origin v1.0'"
          python aws_sagemaker/pipeline.py \
            --role-arn $SAGEMAKER_ROLE_ARN \
            --artifacts-bucket $ART_BUCKET
        fi
